<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cash View - Sohanur Construction</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    body { font-family: "Poppins", sans-serif; background: #eef2f7; padding: 20px; }
    h2 { text-align: center; color: #005bbb; font-weight: 700; margin-bottom: 20px; }
    .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .filters { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; justify-content: center; background: #f9f9f9; padding: 15px; border-radius: 10px; }
    input, select { padding: 10px; border: 1px solid #bbb; border-radius: 8px; font-size: 14px; outline: none; }
    button { padding: 10px 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    button:hover { background: #0056c7; }
    table { width:100%; border-collapse: collapse; margin-top: 15px; }
    thead { background: linear-gradient(90deg, #1976d2, #42a5f5); color: white; }
    th, td { padding: 12px; border: 1px solid #ddd; font-size:14px; text-align:center; }
    .total-row { background: #f2f2f2; font-weight: bold; font-size: 16px; color: #005bbb; }
    
    .print-only-header { display: none; }

    @media print {
        .no-print { display: none; }
        .print-only-header { display: block !important; }
        body { background: white; padding: 0; }
        .container { box-shadow: none; max-width: 100%; width: 100%; padding: 0; }
        table { width: 100%; border: 1px solid #000; }
        th, td { border: 1px solid #000; padding: 8px; }
        thead { background: #eee !important; color: black !important; -webkit-print-color-adjust: exact; }
    }
</style>
</head>
<body>

<h2 class="no-print">Cash Transaction View</h2>

<div class="container">
    <div class="filters no-print">
        <label>From: <input type="date" id="startDate"></label>
        <label>To: <input type="date" id="endDate"></label>
        <select id="payerFilter">
            <option value="">All Payment-By</option>
        </select>
        <button onclick="applyFilters()">Search Data</button>
        <button onclick="printReport()" style="background: #28a745;">Print Report</button>
    </div>

    <div id="printArea">
        <div class="print-only-header">
            <div style="text-align: center; font-size: 24px; font-weight: bold;">SOHANUR CONSTRUCTION & MANPOWER SOLUTION</div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-bottom: 2px solid #000; padding-bottom: 10px;">
                <div style="font-size: 12px; line-height: 1.5;">
                    <b>Phone:</b> 01805-090910 | 01805-090950<br>
                    <b>Email:</b> sohanurconstructionltd@gmail.com<br>
                    <b>Address:</b> Naogaon Sadar, Naogaon (6500)
                </div>
                <img src="https://scontent.fcgp4-1.fna.fbcdn.net/v/t39.30808-6/608517230_908069688449770_4195374660845873501_n.jpg?_nc_cat=110&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeGfSPRJnYPx0OPgbaOP2xi5F73hkL7gPWkXveGQvuA9aQ-hCn2WzwodMKtN3KbCt2JIyYH3DXzx5DOF7O9ZJk4h&_nc_ohc=Vwsl2hKrn7gQ7kNvwFU5Drf&_nc_oc=AdmpaYHQyhB-HlwQ1ZmheVmXsB_O9xghSFRr66quVyQTQP1qu8q8yNdyAnxprIehDeg&_nc_zt=23&_nc_ht=scontent.fcgp4-1.fna&_nc_gid=T6ef5eGVtgQlP1IPFFgYAA&oh=00_AfmryBWilk8mwq465rkwdgjdp7kFtRxYwk37rp1b5S8H3Q&oe=6958AA46" height="70">
            </div>
            <div id="reportTitle" style="text-align: center; font-weight: bold; margin: 15px 0; background: #f2f2f2; padding: 8px; font-size: 16px;">CASH REPORT</div>
        </div>

        <table id="cashTable">
            <thead>
                <tr>
                    <th>TNX-ID</th>
                    <th>Date</th>
                    <th>Payment-By</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4">Loading data...</td></tr>
            </tbody>
            <tfoot>
                <tr class="total-row">
                    <td colspan="3" style="text-align: right;">Grand Total:</td>
                    <td id="grandTotal">0.00 TK</td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<script>
const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTAwqKg4QjdIUWQ31Nxl7wnkIRpx_H80Ddd7lsW4s0bgVowNL2xFSPhOYcB-RwwrO7b0x5lF61Yv03D/pub?gid=239856359&single=true&output=csv";

let allData = [];

// তারিখ ফরম্যাট ঠিক করার ফাংশন (YYYY-MM-DD তে রূপান্তর)
function parseSheetDate(dateStr) {
    if (!dateStr) return "";
    // যদি তারিখ DD/MM/YYYY ফরম্যাটে থাকে
    if (dateStr.includes('/')) {
        const parts = dateStr.split('/');
        if (parts.length === 3) {
            // পপশনাল: যদি বছর ২ ডিজিটের হয় (যেমন ২৫), তাকে ২০২৫ এ রূপান্তর
            let year = parts[2].trim();
            if (year.length === 2) year = '20' + year;
            return `${year}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
        }
    }
    return dateStr.trim(); // যদি অলরেডি YYYY-MM-DD থাকে
}

async function loadData() {
    try {
        const response = await fetch(csvUrl);
        const text = await response.text();
        const rows = text.split(/\r?\n/).slice(1);
        
        const payers = new Set();
        allData = rows.map(row => {
            const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if (cols.length < 5) return null;
            
            const rawDate = cols[2] ? cols[2].replace(/"/g, '').trim() : "";
            const formattedDate = parseSheetDate(rawDate); // তারিখ কনভার্ট করা হলো
            const payer = cols[3] ? cols[3].replace(/"/g, '').trim() : "";
            if(payer) payers.add(payer);

            return {
                tnx: cols[1] ? cols[1].replace(/"/g, '').trim() : "",
                displayDate: rawDate, // শিটে যা আছে তা দেখাবে
                filterDate: formattedDate, // সার্চে কাজ করবে
                payer: payer,
                amount: parseFloat(cols[4]) || 0
            };
        }).filter(item => item !== null);

        // ড্রপডাউন সেট করা
        const select = document.getElementById('payerFilter');
        Array.from(payers).sort().forEach(p => {
            let opt = document.createElement('option');
            opt.value = p; opt.text = p;
            select.appendChild(opt);
        });

        displayData(allData);
    } catch (e) {
        document.getElementById('tableBody').innerHTML = "<tr><td colspan='4'>Error loading data.</td></tr>";
    }
}

function displayData(data) {
    const tbody = document.getElementById('tableBody');
    const totalEl = document.getElementById('grandTotal');
    tbody.innerHTML = "";
    let total = 0;

    data.forEach(item => {
        total += item.amount;
        tbody.innerHTML += `
            <tr>
                <td>${item.tnx}</td>
                <td>${item.displayDate}</td>
                <td>${item.payer}</td>
                <td>${item.amount.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
            </tr>`;
    });

    totalEl.innerText = total.toLocaleString('en-IN', {minimumFractionDigits: 2}) + " TK";
}

function applyFilters() {
    const start = document.getElementById('startDate').value; // YYYY-MM-DD
    const end = document.getElementById('endDate').value;     // YYYY-MM-DD
    const payer = document.getElementById('payerFilter').value;

    const filtered = allData.filter(item => {
        const matchDate = (!start || item.filterDate >= start) && (!end || item.filterDate <= end);
        const matchPayer = !payer || item.payer === payer;
        return matchDate && matchPayer;
    });

    displayData(filtered);
}

function printReport() {
    const start = document.getElementById('startDate').value || "All Time";
    const end = document.getElementById('endDate').value || "Present";
    document.getElementById('reportTitle').innerText = `CASH REPORT: ${start} TO ${end}`;
    window.print();
}

window.onload = loadData;
</script>
</body>
</html>
